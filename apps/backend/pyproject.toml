[project]
name = "backend"
version = "0.1.0"
description = "Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
backend-server = "backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
pytest-beartype = { git = "https://github.com/beartype/pytest-beartype", branch = "main" }
